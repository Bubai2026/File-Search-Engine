<!DOCTYPE html>
<html>
<head>
    <title>File Search Engine</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 60px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .result {
            padding: 15px 0;
            border-bottom: 1px solid #ddd;
        }

        .file {
            font-weight: bold;
        }

        .score {
            color: #666;
            margin-top: 5px;
        }

        #message {
            margin-top: 25px;
        }
    </style>
</head>

<body>
    <h1>File Search Engine</h1>

    <div class="search-box">
        <input
            id="query"
            type="text"
            placeholder="Search... e.g. algorithm or alg*"
        >
        <button onclick="searchFiles()">Search</button>
    </div>

    <div id="message"></div>
    <div id="results"></div>

    <script>
        async function searchFiles() {
            const query = document.getElementById("query").value.trim();
            const results = document.getElementById("results");
            const message = document.getElementById("message");

            results.innerHTML = "";

            if (!query) {
                message.textContent = "Enter a search query.";
                return;
            }

            message.textContent = "Searching...";

            try {
                const response = await fetch(
                    "/search?q=" + encodeURIComponent(query)
                );

                const data = await response.json();

                if (!response.ok) {
                    message.textContent = data.error || "Search failed.";
                    return;
                }

                message.textContent = "";

                if (data.length === 0) {
                    message.textContent = "No results found.";
                    return;
                }

                data.forEach((item, index) => {
                    const div = document.createElement("div");
                    div.className = "result";

                    div.innerHTML =
                        "<div class='file'>" +
                        (index + 1) + ". " +
                        item.file +
                        "</div>" +
                        "<div class='score'>TF-IDF Score: " +
                        item.score.toFixed(6) +
                        "</div>";

                    results.appendChild(div);
                });
            } catch (error) {
                message.textContent = "Could not connect to the server.";
            }
        }

        document.getElementById("query").addEventListener(
            "keydown",
            function(event) {
                if (event.key === "Enter") {
                    searchFiles();
                }
            }
        );
    </script>
</body>
</html>
